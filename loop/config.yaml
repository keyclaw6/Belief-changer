# Auto-Tuning Loop Configuration
# SOLE authority for routes, models, and parameters. Before every model
# call, read the values here; nothing in PROGRAM.md overrides this file.
# These are STARTING POINTS. The loop can hypothesize changes to any value.

# Writer — the six-input contract lives in PROGRAM.md Step 3
writer_model: meta/muse-spark-1.1
writer_endpoint: https://openrouter.ai/api/v1/chat/completions
writer_reasoning: high   # the highest reasoning Muse Spark 1.1 offers
writer_temperature: 0.7
# No completion cap: requests omit max_tokens; no model fallbacks.

# Research
researcher_model: deepseek/deepseek-v4-pro
researcher_endpoint: https://openrouter.ai/api/v1/responses
researcher_reasoning: xhigh
researcher_tools: [web_search, web_fetch]
# Depth is sacred: no search/fetch limits. Go as wide as still brings results.
research_search_limit: unlimited
research_fetch_limit: unlimited
# Reuse: research artifacts are reused across iterations unless the
# hypothesis changes the research stage or the brief (PROGRAM Step 3).

# Planner — the master-plan skill call runs on Kimi K3 through the
# founder's opencode go subscription (Zen gateway, OpenAI-compatible).
# On first authenticated run, verify the exact model id against
# GET https://opencode.ai/zen/v1/models and correct it here if K3's
# published id differs.
# (Its review gate is a GPT role: plan_reviewer_* below, per the skill.)
planner_model: kimi-k3
planner_endpoint: https://opencode.ai/zen/v1/chat/completions
planner_auth_env: OPENCODE_GO_API_KEY
planner_reasoning: high

# GPT roles (framing, commissioning, judging, trace analysis, hypothesizing,
# evidence editing, plan review): fresh clean calls through the OpenAI
# subscription OAuth — one Responses API call per role, carrying ONLY the
# role prompt and its listed inputs. No hosted agent, no host system
# prompt, no tools, no filesystem. Never OpenRouter.
openai_endpoint: https://api.openai.com/v1/responses
openai_auth_env: OPENAI_OAUTH_TOKEN   # operator's subscription OAuth token; never committed
judge_model: gpt-5.6-sol
judge_reasoning: medium
analyzer_model: gpt-5.6-luna
analyzer_reasoning: high
hypothesizer_model: gpt-5.6-sol
hypothesizer_reasoning: xhigh
framing_model: gpt-5.6-sol
framing_reasoning: xhigh
commissioner_model: gpt-5.6-sol
commissioner_reasoning: xhigh
evidence_editor_model: gpt-5.6-sol
evidence_editor_reasoning: xhigh
plan_reviewer_model: gpt-5.6-sol
plan_reviewer_reasoning: xhigh

# Reference
reference_dir: calibration/reference/gsbs
# Chapter mapping: loop/reference-alignment.md (content-based).
# NEVER a mechanical offset.

# Loop rules
max_consecutive_no_improvement: 5
strike_limit: 3
