# Auto-Tuning Loop Configuration
# Preferred role defaults. Before every model call, read the values here.
# A harness maps each role to the model it can reach (see loop/HARNESS.md).
# Models, fallback models, routes, and endpoints are FOUNDER-ONLY — the
# hypothesizer and orchestrator must not change them. Remaining parameters
# (reasoning, research depth) are the loop's tuning surface. Trace
# metadata.json records what actually ran.
#
# ROUTES (preferred defaults, founder 2026-08-23). The endpoint/auth/route-name
# fields marked [PI BINDING] are the pi-harness realization only — another
# harness substitutes its own connection and ignores those fields.
#   opencode-go  — [PI BINDING] OpenCode Go. Primary for Muse Spark roles
#                  (writer, plan-writer) on paid contributor, and for every
#                  other role on DeepSeek V4 Flash. Workspace must opt in.
#   opencode     — [PI BINDING] OpenCode Zen. Muse mid-chain: contributor-free
#                  with OPENCODE_API_KEY (do not put the Go key on Zen).
#   vercel       — Vercel AI Gateway. Last coded fallback for Muse Spark roles
#                  (same contributor weights, paid). 402 insufficient_funds
#                  2026-09-04; a top-up restores it. Never the non-contributor
#                  alias (same weights, ~20× cost).
# Command Code is retired. There is no OpenAI subscription (openai-sub) route.
#
# Reasoning values the routes accept: low/medium/high/max.

# ── Writer — chapter-writer sub-agent (contract: prompts/chapter-writer.md) ──
# Muse Spark 1.3 chain (founder-authorized; all writes go through muse_client.py):
#   1. opencode-go  muse-spark-1.3-contributor      OPENCODE_GO_API_KEY  /zen/go/v1/responses
#   2. opencode     muse-spark-1.3-contributor-free OPENCODE_API_KEY     /zen/v1/responses
#   3. vercel       meta/muse-spark-1.3-contributor AI_GATEWAY_API_KEY   (last resort)
# 429: up to 4 tries × 90s on that route, then next. 403/401/402 fall through
# immediately. Never non-contributor. Never rotate the Go key onto Zen.
writer_model: muse-spark-1.3-contributor
writer_fallback_model: muse-spark-1.3-contributor-free
writer_endpoint: https://opencode.ai/zen/go/v1/responses
writer_auth_env: OPENCODE_GO_API_KEY
writer_route: opencode-go
writer_fallback_endpoint: https://opencode.ai/zen/v1/responses
writer_fallback_auth_env: OPENCODE_API_KEY
writer_fallback_route: opencode
# No completion cap: requests omit max_tokens.

# ── Plan-writer — master-plan skill (contract: prompts/master-plan-skill-v2.md)
# Same Muse Spark routing as the writer.
planner_model: muse-spark-1.3-contributor
planner_fallback_model: muse-spark-1.3-contributor-free
planner_endpoint: https://opencode.ai/zen/go/v1/responses
planner_auth_env: OPENCODE_GO_API_KEY
planner_route: opencode-go
planner_fallback_endpoint: https://opencode.ai/zen/v1/responses
planner_fallback_auth_env: OPENCODE_API_KEY
planner_fallback_route: opencode
planner_reasoning: high

# ── Hypothesizer — loop/prompts/hypothesizer.md ──
# Claude Fable 5.1 as a fresh harness sub-agent (Cursor: Task spawn). The
# harness spawn is the route; no HTTP endpoint, no Muse fallback. One call
# per iteration: retry once on the same model, then escalate to the founder.
hypothesizer_model: claude-fable-5-1
hypothesizer_route: harness-subagent
hypothesizer_reasoning: high

# ── Everything else runs on DeepSeek V4 Flash via the OpenCode Zen ──
# ── subscription (opencode route). ──

# Research — the orchestrator/lead AND the sub-agents it spawns.
# DeepSeek V4 Flash via OpenCode Zen. Depth stays sacred and unlimited;
# sub-agents search/fetch via scripts/loop-runner/web_tools.py.
researcher_model: deepseek-v4-flash
researcher_endpoint: https://opencode.ai/zen/go/v1
researcher_auth_env: OPENCODE_API_KEY
researcher_route: opencode-go
researcher_reasoning: high
research_subagent_model: deepseek-v4-flash
research_subagent_reasoning: high
research_subagent_route: opencode-go
# Depth is sacred: no search/fetch limits. Go as wide as still brings results.
research_search_limit: unlimited
research_fetch_limit: unlimited
# Reuse: research artifacts are reused across iterations unless the
# hypothesis changes the research stage or the brief (PROGRAM Step 3).

# Plan-reviewer — the plan-review gate (contract: prompts/master-plan-reviewer-v2.md)
plan_reviewer_model: deepseek-v4-flash
plan_reviewer_reasoning: high
plan_reviewer_route: opencode-go

# Judges — the three chapter judges + book-arc (loop/judges/*.md)
judge_model: deepseek-v4-flash
judge_reasoning: high
judge_route: opencode-go

# Trace-analyzer — loop/prompts/trace-analyzer.md
analyzer_model: deepseek-v4-flash
analyzer_reasoning: high
analyzer_route: opencode-go

# Shared OpenCode Zen endpoint/auth for every opencode-routed role above.
opencode_endpoint: https://opencode.ai/zen/go/v1
opencode_auth_env: OPENCODE_API_KEY

# Reference
reference_dir: calibration/reference/gsbs
# Chapter mapping: loop/reference-alignment.md (content-based).
# NEVER a mechanical offset.

# Loop rules
max_consecutive_no_improvement: 5
strike_limit: 3
