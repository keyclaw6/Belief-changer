# Auto-Tuning Loop Configuration
# SOLE authority for routes, models, and parameters. Before every model
# call, read the values here; nothing in PROGRAM.md overrides this file.
# These are STARTING POINTS. The loop can hypothesize changes to any value.

# Writer — the six-input contract lives in PROGRAM.md Step 3
# Route change 2026-08-07 (founder): all provider calls go through the
# Command Code proxy loopback; no fallbacks — failure escalates to founder.
# Model must be in the founder's Command Code plan (verified live 2026-08-07:
# deepseek v4 pro/flash, MiniMax-M3, Kimi-K3, Qwen3.7-Max, free Laguna OK;
# Claude/Gemini/GPT ids return MODEL_NOT_IN_PLAN). Starting point: DeepSeek
# V4 Pro with reasoning high.
writer_model: deepseek/deepseek-v4-pro
writer_endpoint: http://127.0.0.1:3050/v1/chat/completions
writer_auth_env: COMMANDCODE_API_KEY
writer_reasoning: high
writer_temperature: 0.7
# No completion cap: requests omit max_tokens; no model fallbacks.

# Research — MiniMax M3 (chat completions + function calling; the proxy has
# no native web tools, so the orchestrator executes web_search/web_fetch for
# the model — depth stays unlimited). Founder instruction 2026-07-29 moved
# research to MiniMax M3; the 2026-08-07 route change moves the transport to
# the Command Code proxy (exact listed model id: MiniMaxAI/MiniMax-M3).
researcher_model: MiniMaxAI/MiniMax-M3
researcher_endpoint: http://127.0.0.1:3050/v1/chat/completions
researcher_auth_env: COMMANDCODE_API_KEY
researcher_transport: chat-tools   # orchestrator-executed web tools
researcher_reasoning: high
researcher_tools: [web_search, web_fetch]
# Depth is sacred: no search/fetch limits. Go as wide as still brings results.
research_search_limit: unlimited
research_fetch_limit: unlimited
# Reuse: research artifacts are reused across iterations unless the
# hypothesis changes the research stage or the brief (PROGRAM Step 3).

# Planner — the master-plan skill call runs on Kimi K3 through the Command
# Code proxy (OpenAI-compatible; exact listed model id: moonshotai/Kimi-K3).
# Models list: GET http://127.0.0.1:3050/v1/models
# (Its review gate is a GPT role: plan_reviewer_* below, per the skill.)
planner_model: moonshotai/Kimi-K3
planner_endpoint: http://127.0.0.1:3050/v1/chat/completions
planner_auth_env: COMMANDCODE_API_KEY
planner_reasoning: high

# GPT roles (framing, commissioning, judging, trace analysis, hypothesizing,
# evidence editing, plan review): fresh clean chat-completions calls through
# the Command Code proxy (route change 2026-08-07). Request contract per
# call: role prompt as the system message, the listed inputs as the user
# message, stream true. One call per role, carrying ONLY the role prompt and
# its listed inputs. No hosted agent, no host system prompt, no tools, no
# filesystem.
# Model must be in the founder's Command Code plan: gpt-5.6-sol/terra and
# every other GPT id return MODEL_NOT_IN_PLAN (verified 2026-08-07), so all
# roles start on gpt-5.6-luna; the loop may hypothesize other in-plan ids.
# Reasoning values the proxy accepts: low/medium/high/max.
gpt_endpoint: http://127.0.0.1:3050/v1/chat/completions
gpt_auth_env: COMMANDCODE_API_KEY
judge_model: gpt-5.6-luna
judge_reasoning: medium
analyzer_model: gpt-5.6-luna
analyzer_reasoning: high
hypothesizer_model: gpt-5.6-luna
hypothesizer_reasoning: max
framing_model: gpt-5.6-luna
framing_reasoning: max
commissioner_model: gpt-5.6-luna
commissioner_reasoning: max
evidence_editor_model: gpt-5.6-luna
evidence_editor_reasoning: max
plan_reviewer_model: gpt-5.6-luna
plan_reviewer_reasoning: max

# Reference
reference_dir: calibration/reference/gsbs
# Chapter mapping: loop/reference-alignment.md (content-based).
# NEVER a mechanical offset.

# Loop rules
max_consecutive_no_improvement: 5
strike_limit: 3
